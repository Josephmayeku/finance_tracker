<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Tracker</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:21px;margin:2px 0}h2{font-size:15px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

@keyframes p{50%{opacity:.25}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

input,select,button.b{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;width:100%}
button.p{background:var(--accent);color:var(--at);border:0;font:inherit;font-weight:600;width:100%;padding:12px;border-radius:10px;cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:8px}

.ln{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.ln.t{border-top:1px solid var(--line);font-weight:700;margin-top:3px;padding-top:8px}

.chart{display:flex;align-items:flex-end;gap:8px;height:120px}

.chart .bars i{width:42%;border-radius:4px 4px 0 0;min-height:2px}
.chart small{font-size:11px;color:var(--muted);margin-top:4px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:3px 0 9px}.bar>i{display:block;height:100%;background:var(--exp)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.m{color:var(--muted);font-size:13px}.del{background:none;border:0;color:var(--exp);cursor:pointer;padding:4px 6px;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:14px 0}.sm{width:auto;padding:8px 12px;font-size:14px}
.pie{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.pie svg{flex:0 0 auto}.leg{flex:1;min-width:140px;font-size:14px}.leg div{display:flex;align-items:center;gap:6px;padding:2px 0}.leg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}.leg span{margin-left:auto;color:var(--muted)}
main{padding-bottom:160px}
.hero{background:var(--card);border-radius:26px;padding:16px;margin-bottom:12px}

.av,.ic{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.hrow{display:flex;gap:12px;align-items:stretch}.hrow>div:first-child{flex:1.3;min-width:0}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.mini{display:flex;align-items:flex-end;gap:5px;height:36px;margin-top:10px}.mini i{width:7px;background:var(--line);border-radius:3px}.mini i.on{background:var(--accent)}
.gcard{flex:1;background:linear-gradient(145deg,#27c485,#0e8a5a);color:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;min-height:130px}
.circ{display:flex;gap:16px;overflow-x:auto;padding:8px 0 2px}.circ>div{text-align:center;font-size:12px;color:var(--muted);flex:0 0 auto;cursor:pointer}

.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--at);font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;z-index:5}
.tabs3{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}.tabs3 button{flex:1;border:0;background:none;color:var(--muted);padding:8px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}.tabs3 button.on{background:var(--text);color:var(--card);font-weight:600}
.mm{display:flex;gap:10px;margin-bottom:8px}.mm>div{flex:1;display:flex;gap:8px;align-items:center}
.top3{display:flex;gap:8px;margin-top:10px}.top3>div{flex:1;background:var(--bg);border-radius:16px;padding:10px 4px;text-align:center;font-size:12px}
.card{border-radius:22px}

.f{margin-bottom:10px}.f .k{margin-bottom:3px}.err{color:var(--exp);font-size:14px;min-height:18px}
.gear{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.aiA h3{font-size:15px;margin:12px 0 4px}.aiA p{margin:6px 0}.aiA ul{margin:4px 0;padding-left:20px}.aiA li{margin:3px 0}
#remind{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:calc(100% - 20px);max-width:420px;z-index:40;display:flex;flex-direction:column;gap:8px}
.rm{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.rm b{display:block;margin-bottom:3px}.rm .m{margin-bottom:8px}.rm .rb{display:flex;gap:8px}
.rm button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:14px;cursor:pointer}.rm button.pr{background:var(--accent);color:var(--at);border:0;font-weight:600}
.chk{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:15px}input[type=checkbox]{width:20px;height:20px;padding:0;flex:0 0 auto}
#lock{background:radial-gradient(120% 65% at 50% -8%,#15855d 0%,rgba(21,133,93,0) 62%),radial-gradient(70% 45% at 100% 100%,rgba(243,207,99,.14),transparent 65%),#04130e;color:#fff;align-items:flex-start;padding:calc(48px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#lock .wrap{width:100%;max-width:420px;margin:0 auto;text-align:left}
#lock .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:6vh 0 30px}
#lock .brand svg{width:66px;height:54px;flex:0 0 auto}#lock .brand b{font-size:30px;letter-spacing:-.5px;color:#fff;font-weight:700}
#lock h2{font-size:38px;line-height:1.1;margin:0 0 14px;color:#fff;text-align:center;font-weight:800;letter-spacing:-1px}
#lock .sub{color:rgba(255,255,255,.78);font-size:17px;line-height:1.5;text-align:center;margin-bottom:36px}
#lock label{display:block;color:#fff;font-size:16px;margin:0 0 8px 4px}
#lock .pinbox{display:flex;align-items:center;gap:14px;background:#f8f8f8;border:1px solid #e6e6e6;border-radius:22px;height:62px;padding:0 22px;margin-bottom:18px}
#lock .pinbox span{color:#1a1a1a;font-weight:700;font-size:19px}
#lock .pinbox input{flex:1;min-width:0;width:auto;height:100%;border:0;background:transparent;color:#1a1a1a;font-size:20px;letter-spacing:3px;text-align:left;margin:0;padding:0;outline:none}
#lock .pinbox input::placeholder{color:#9a9a9a;letter-spacing:0;font-size:18px}#lock .pinbox.ro{opacity:.8}
#lock .err{min-height:20px;color:#ffc2bb;font-size:14px;margin:-6px 4px 8px}
#lock .go{width:100%;height:58px;border:0;border-radius:18px;background:linear-gradient(135deg,#f8dc7c,#d9a21b);color:#2a1d00;font:inherit;font-size:18px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 10px 28px rgba(243,207,99,.32)}#lock .go:active{filter:brightness(.92)}
#lock .fg{display:block;margin:16px auto 0;border:0;background:none;color:rgba(255,255,255,.65);font:inherit;font-size:14px;cursor:pointer}
#lock .tc{text-align:center;color:rgba(255,255,255,.78);font-size:15px;margin-top:34px;line-height:1.5}
#lock .tc button{border:0;background:none;color:#fff;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.shake{animation:shk .4s}
#terms{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 65% at 50% -8%,#15855d 0%,rgba(21,133,93,0) 62%),radial-gradient(70% 45% at 100% 100%,rgba(243,207,99,.14),transparent 65%),#04130e;color:#fff;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px))}
#terms .tw{max-width:560px;margin:0 auto}#terms h1{font-size:28px;margin:6px 0 4px;color:#fff}#terms .sub{color:rgba(255,255,255,.78);margin-bottom:10px;font-size:14px}
#terms h3{font-size:17px;margin:22px 0 6px;color:#f3cf63}#terms p,#terms li{color:rgba(255,255,255,.86);font-size:15px;line-height:1.55;margin:6px 0}#terms ul{padding-left:20px;margin:6px 0}
#terms .go{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,#f8dc7c,#d9a21b);color:#2a1d00;font:inherit;font-size:17px;font-weight:800;margin-top:26px;cursor:pointer}
.dh{font-weight:700;font-size:15px;margin:16px 2px 8px}
.txc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.ti{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
.ti.out{background:rgba(220,70,70,.13);color:var(--exp)}.ti.in{background:rgba(34,170,90,.15);color:var(--inc)}.ti.tr{background:rgba(70,115,225,.15);color:#4f7be0}
.tm{flex:1;min-width:0}.tm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tm .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta{font-weight:700;white-space:nowrap;text-align:right}.ta.in{color:var(--inc)}
.qa{display:flex;justify-content:space-around;text-align:center}.qa>div{cursor:pointer;font-size:13px;font-weight:600;flex:1}
.qa span{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--at);margin:0 auto 7px;box-shadow:0 6px 14px rgba(18,160,107,.28)}
.circ span{color:var(--accent)}.gear{color:var(--text);display:grid;place-items:center}
.ni{display:block;height:26px;pointer-events:none}.ni svg{width:25px;height:25px}
.chips button.on{background:var(--accent);color:var(--at);border-color:var(--accent)}
.rph{display:flex;align-items:center;gap:6px}
.rpt{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--text);font:inherit;cursor:pointer;padding:4px 0}
.chev{display:grid;place-items:center;transition:transform .2s;color:var(--muted);flex:0 0 auto}.chev.open{transform:rotate(180deg)}
.dl{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--bg);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0;flex:0 0 auto}
.rpb{position:relative;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);overflow:hidden}
.rpb::after{content:'FINANCE TRACKER';position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-28deg);font-size:30px;font-weight:800;letter-spacing:4px;color:var(--text);opacity:.05;pointer-events:none;white-space:nowrap}
.sws{display:flex;flex-wrap:wrap;gap:10px}.sws button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;font:inherit;font-size:12px;font-weight:700;color:var(--muted)}.sws button.on{outline:3px solid var(--accent);outline-offset:2px}
.gla{border-top:1px solid var(--line)}.glt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--text);font:inherit;padding:10px 0;cursor:pointer}
.glr{display:flex;justify-content:space-between;gap:10px;padding:7px 0 7px 26px;border-top:1px dashed var(--line);font-size:14px}.glr .gr{text-align:right;white-space:nowrap}
.drcr{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--bg);margin-right:5px}
.chipst{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);white-space:nowrap}
.accb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--text);font:inherit;padding:0;cursor:pointer;text-align:left}
@media print{nav,.noprint,.top .live{display:none}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Finance Tracker</h1><div style="display:flex;align-items:center;gap:10px"><button class="gear" data-go="ai" aria-label="AI insights"><svg viewBox='0 0 24 24' width='19' height='19' fill='none' stroke='currentColor' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z'/></svg></button><button class="gear" data-go="set" aria-label="Settings"><svg viewBox='0 0 24 24' width='19' height='19' fill='none' stroke='currentColor' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='3'/><path d='M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z'/></svg></button></div></div>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
let INC=[],EXP=[],ACC=[];
const KEY="fin-v2";
let S={tx:[],open:{"Cash":0,"Bank":0,"Mobile Money":0}};
try{const r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.tx)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const today=new Date().toISOString().slice(0,10);
let tab="dash",ttype="expense",ptype="month",pmonth=today.slice(0,7);
const money=n=>(n<0?"-":"")+"UGX "+Math.abs(Math.round(n)).toLocaleString("en-US",{maximumFractionDigits:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sum=a=>a.reduce((s,x)=>s+x.amount,0);
const inR=(t,a,b)=>t.date>=a&&t.date<=b;
function byCat(rows){const o={};rows.forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function delta(t,a){if(t.type==="transfer")return t.acct===a?-t.amount:t.to===a?t.amount:0;if(t.acct!==a)return 0;return t.type==="income"?t.amount:-t.amount}
function bal(a,end){const acc=ACC.find(x=>x.n===a)||{l:0},d=S.tx.filter(t=>t.date<=end).reduce((s,t)=>s+delta(t,a),0);return acc.l?(+S.open[a]||0)-d:(+S.open[a]||0)+d}
function range(){if(rPreset==='all')return['0000-01-01','9999-12-31','All time'];return[rFrom,rTo,fmtD(rFrom)+' to '+fmtD(rTo)]}
function netWorth(end){let a=0,l=0;ACC.forEach(x=>{const b=bal(x.n,end);x.l?l+=b:a+=b});return{a,l,e:a-l}}

const PC=["#0f766e","#2563eb","#d97706","#9333ea","#dc2626","#0891b2","#65a30d","#db2777"];
function pie(data){
  const tot=data.reduce((s,x)=>s+x[1],0);if(!tot)return '<div class="empty">No data yet.</div>';
  let a=-Math.PI/2;
  const sl=data.map(([c,v],i)=>{const f=v/tot,col=PC[i%PC.length];
    if(f>0.9999)return `<circle cx="60" cy="60" r="56" fill="${col}"/>`;
    const b=a+f*2*Math.PI,x1=60+56*Math.cos(a),y1=60+56*Math.sin(a),x2=60+56*Math.cos(b),y2=60+56*Math.sin(b);a=b;
    return `<path d="M60 60L${x1.toFixed(2)} ${y1.toFixed(2)}A56 56 0 ${f>.5?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${col}" stroke="var(--card)" stroke-width="1.5"><title>${c}: ${money(v)}</title></path>`}).join("");
  return `<div class="pie"><svg viewBox="0 0 120 120" width="130" height="130" role="img" aria-label="Pie chart">${sl}</svg><div class="leg">${data.map(([c,v],i)=>`<div><i style="background:${PC[i%PC.length]}"></i>${esc(c)}<span>${Math.round(v/tot*100)}% · ${money(v)}</span></div>`).join("")}</div></div>`}

const pad=n=>String(n).padStart(2,'0');
const nowD=()=>new Date();
const mKey=k=>{const n=nowD(),d=new Date(n.getFullYear(),n.getMonth()-k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mEnd=k=>{const n=nowD(),d=new Date(n.getFullYear(),n.getMonth()-k+1,0);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mLab=k=>{const n=nowD();return new Date(n.getFullYear(),n.getMonth()-k,1).toLocaleString('en',{month:'short'})};

  const body=!any?`<div class="empty" data-go="bud" style="cursor:pointer">No budgets set yet. Tap here to set monthly budgets.</div>`:rs.map(x=>{const over=x.act>x.bud,pc=x.bud?Math.min(100,x.act/x.bud*100):100;return `<div class="ln" style="padding-bottom:0"><span>${x.c}</span><span>${money(x.act)} / ${money(x.bud)}</span></div><div class="bar"><i style="width:${pc}%;background:${over?"var(--exp)":"var(--accent)"}"></i></div><div class="m" style="margin:-4px 0 8px;color:${over?"var(--exp)":"var(--inc)"}">${x.bud?(over?"Over by "+money(x.act-x.bud):"Under by "+money(x.bud-x.act)+" ("+Math.round(x.act/x.bud*100)+"% used)"):"No budget set"}</div>`}).join("")+`<div class="ln t"><span>Total</span><span>${money(ta)} / ${money(tb)}</span></div><div class="m">${tb>=ta?"Under budget by "+money(tb-ta):"Over budget by "+money(ta-tb)}</div>`;
  return `<div class="card"><h2>Budget vs actual</h2>${body}</div>`}
function prof(){const p=S.profile,ini=((p.name||'?').trim()[0]||'?').toUpperCase();
  return `<div class="card" style="text-align:center"><div class="av" style="width:96px;height:96px;font-size:38px;margin:0 auto 8px;font-weight:700;overflow:hidden">${p.photo?`<img src="${p.photo}" alt="Profile photo" style="width:100%;height:100%;object-fit:cover">`:esc(ini)}</div><b>${esc(p.name||'Your name')}</b><div class="m">${S.pin?(authed?'Signed in':'Signed out'):'No PIN set'}</div>
  <div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="b sm" id="pf-pick">📷 ${p.photo?'Change':'Upload'} photo</button>${p.photo?'<button class="b sm" id="pf-rmphoto">Remove</button>':''}</div><input id="pf-photo" type="file" accept="image/jpeg,image/png,image/webp" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><div class="err" id="pf-pmsg" style="margin-top:6px"></div></div>
  <div class="card"><h2>My info</h2>
  <div class="f"><div class="k">Name</div><input id="pf-name" value="${esc(p.name||'')}" placeholder="Full name"></div>
  <div class="f"><div class="k">Email (used for PIN recovery)</div><input id="pf-email" type="email" inputmode="email" autocomplete="email" value="${esc(p.email||'')}" placeholder="you@example.com"></div>
  <div class="f"><div class="k">Telephone</div><input id="pf-tel" type="tel" value="${esc(p.tel||'')}" placeholder="+256 ..."></div>
  <div class="f"><div class="k">Date of birth</div><input id="pf-dob" type="date" value="${esc(p.dob||'')}"></div>
  <div class="f"><div class="k">Age</div><input id="pf-age" readonly value="${ageOf(p.dob)}" placeholder="Calculated from date of birth"></div>
  <div class="f"><div class="k">Location</div><input id="pf-loc" value="${esc(p.loc||'')}" placeholder="e.g. Kampala, Uganda"></div>
  <button class="p" id="saveinfo">Save info</button><div class="m" id="pfmsg" style="margin-top:6px"></div></div>
  <div class="card"><h2>Security</h2>
  ${S.pin?'<div class="f"><div class="k">Current PIN</div><input id="pf-cur" type="password" inputmode="numeric" maxlength="6"></div>':''}
  <div class="f"><div class="k">${S.pin?'New PIN':'Create a PIN'} (4-6 digits)</div><input id="pf-new" type="password" inputmode="numeric" maxlength="6"></div>
  <div class="f"><div class="k">Confirm PIN</div><input id="pf-new2" type="password" inputmode="numeric" maxlength="6"></div>
  <button class="p" id="savepin">${S.pin?'Change PIN':'Set PIN'}</button><div class="err" id="pinmsg" style="margin-top:6px"></div>
  <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><b>PIN recovery key</b><div class="m" style="margin:4px 0 8px">If you forget your PIN, this key lets you set a new one without erasing your data. Save it, and email it to yourself so you can find it later. ${S.recHash?'A recovery key is set up.':'You have not created one yet.'}</div>
  ${S.pin?`<button class="b" id="rk-new">${S.recHash?'Create a new recovery key':'Create recovery key'}</button>`:'<div class="m">Set a PIN first, then you can create a recovery key.</div>'}<div id="rk-box"></div></div>
  <button class="b" id="signout" style="margin-top:14px;width:100%">Sign out</button>
  <div class="m" style="margin-top:8px">The PIN protects this app on this device only. Data is not encrypted and does not sync between devices.</div></div>`}
document.addEventListener('click',async e=>{const id=e.target.id;
  if(id==='signin'){const v=$('lpin').value;if(v&&await hash(v)===S.pin){S.pinLen=v.length;save();authed=true;lockScreen();render()}else{$('lerr').textContent='Wrong PIN. Try again.';$('lpin').value='';const dz=document.querySelector('#lock .pinbox:not(.ro)');if(dz){dz.classList.add('shake');setTimeout(()=>dz.classList.remove('shake'),450)}}}
  else if(id==='forgot'){lockRecovery('key')}
  else if(id==='signout'){if(!S.pin){const m=$('pinmsg');m.style.color='var(--exp)';m.textContent='Create a PIN first to use sign in and sign out.';return}authed=false;lockScreen()}
  else if(id==='saveinfo'){const em=$('pf-email').value.trim(),m=$('pfmsg');if(em&&!/^\S+@\S+\.\S+$/.test(em)){m.style.color='var(--exp)';m.textContent='Please enter a valid email address.';return}
    S.profile={...S.profile,name:$('pf-name').value.trim(),email:em,tel:$('pf-tel').value.trim(),dob:$('pf-dob').value,loc:$('pf-loc').value.trim()};save();m.textContent='Saved ✓';m.style.color='var(--inc)'}
  else if(id==='savepin'){const m=$('pinmsg'),n=$('pf-new').value,n2=$('pf-new2').value;m.style.color='var(--exp)';
    if(S.pin&&await hash($('pf-cur').value)!==S.pin){m.textContent='Current PIN is incorrect.';return}
    if(!/^\d{4,6}$/.test(n)){m.textContent='PIN must be 4 to 6 digits.';return}
    if(n!==n2){m.textContent='PINs do not match.';return}
    S.pin=await hash(n);S.pinLen=n.length;authed=true;save();render();const m2=$('pinmsg');m2.style.color='var(--inc)';m2.textContent='PIN saved ✓'}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lpin')$('signin').click()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='pf-dob')$('pf-age').value=ageOf(t.value);else if(t.dataset&&t.dataset.bud){S.budget[t.dataset.bud]=parseFloat(t.value)||0;save();const bt=$('bud-total');if(bt)bt.textContent=money(EXP.reduce((a,c)=>a+(+S.budget[c]||0),0))}});
async function saveFile(name,data){
  let d=null;try{d=(window.claude&&claude.use)?await claude.use('downloads'):null}catch(e){}
  if(d){try{await d.save({filename:name,data})}catch(e){if(!e||e.code!=='declined')alert('Could not save the file here.')}return}
  const C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{let b64;if(typeof data==='string')b64=btoa(unescape(encodeURIComponent(data)));else{const u8=new Uint8Array(data.buffer||data),ck=[];for(let i=0;i<u8.length;i+=32768)ck.push(String.fromCharCode.apply(null,u8.subarray(i,i+32768)));b64=btoa(ck.join(''))}
      const r=await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await C.Plugins.Share.share({title:name,url:r.uri,dialogTitle:'Save or share '+name})}
    catch(err){if(!/cancel|dismiss/i.test(String(err&&(err.message||err))))alert('Could not save the file.')}return}
  const blob=data instanceof Blob?data:new Blob([data]),u=document.createElement('a');u.href=URL.createObjectURL(blob);u.download=name;u.click()}

document.addEventListener("click",e=>{
  const t=e.target,d=t.dataset||{};
  const lg=t.closest&&t.closest("[data-lm]"),g=t.closest&&t.closest("[data-bi]"),gg=t.closest&&t.closest("[data-go]");
  if(lg){lm=lm===+lg.dataset.lm?-1:+lg.dataset.lm;render()}
  else if(g){si=+g.dataset.bi;render()}
  else if(d.sp){sp=d.sp;si=-1;render()}
  else if(gg){const g2=gg.dataset.go;if(gg.dataset.tt)ttype=gg.dataset.tt;if((g2==="set"||g2==="ai"||g2==="sav"||g2==="bud")&&tab!==g2){prevTab=tab;tab=g2}else if(g2==="set"||g2==="ai"||g2==="sav"||g2==="bud"||g2==="back"){tab=prevTab}else tab=g2;window.scrollTo(0,0);render()}
  else if(d.tab){tab=d.tab;render()}
  else if(d.t){ttype=d.t;render()}
  else if(d.id){S.tx=S.tx.filter(x=>x.id!==d.id);save();render()}
  else if(t.id==="add"){const amount=parseFloat($("amt").value);if(!(amount>0)){$("amt").focus();return}
    const tx={id:Date.now().toString(36)+Math.random().toString(36).slice(2,4),type:ttype,amount,date:$("date").value||today,acct:$("acct").value,note:$("note").value.trim()};
    if(ttype==="transfer"){tx.to=$("to").value;if(tx.to===tx.acct){alert("Choose two different accounts.");return}}else tx.cat=$("cat").value;
    S.tx.push(tx);save();render()}
  else if(t.id==="csv"){const h="date,type,category,account,to,amount,note\n",b=S.tx.map(x=>[x.date,x.type,x.cat||"",x.acct,x.to||"",x.amount,'"'+(x.note||"").replace(/"/g,'""')+'"'].join(",")).join("\n");
    saveFile("transactions.csv",h+b)}
  else if(t.id==="print")pdfReport();
  else if(t.id==="reset"&&confirm("Delete all transactions and balances?")){S={tx:[],open:{"Cash":0,"Bank":0,"Mobile Money":0}};save();render()}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="pt"){ptype=t.value;render()}else if(t.id==="pm"){pmonth=t.value||pmonth;render()}
  else if(t.dataset.open){S.open[t.dataset.open]=parseFloat(t.value)||0;save()}});

render();lockScreen();setTimeout(()=>showReminders(),1200);setInterval(()=>showReminders(),30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)showReminders()});
</script>
